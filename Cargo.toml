[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/provider",
    "crates/router",
    "crates/tools",
    "crates/agent",
    "crates/cli",
    "crates/mcp",
    "crates/skills",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Swuarez/kiln-agent"

[workspace.dependencies]
kiln-core = { path = "crates/core" }
kiln-provider = { path = "crates/provider" }
kiln-router = { path = "crates/router" }
kiln-tools = { path = "crates/tools" }
kiln-agent = { path = "crates/agent" }
kiln-mcp = { path = "crates/mcp" }
kiln-skills = { path = "crates/skills" }

async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util", "net", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
